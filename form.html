<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MGIS 3320- Q8 </title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

<h2>MGIS 3320 - Q8</h2>

<form action="register_account.html" method="post" id="registration_form">

<fieldset>
    <legend>Registration Information</legend>

    <label for="email">E-Mail:</label>
    <input type="email" name="email" id="email" 
    autofocus required autocomplete="on"><br>

    <label for="password">Password:</label>
    <input type="password" name="password" id="password"
    required
    placeholder="At least 6 letters or numbers"
    pattern="[a-zA-Z0-9]{6,}"
    title="must be at least 6 aphanumeric characters"><br>

    <label for="verify">Verify Password:</label>
    <input type="password" name="verify" id="verify"
    required><br>
</fieldset>

<fieldset>
    <legend>Member Information</legend>

    <label for="first name">First Name:</label>
    <input type="text" name="first_name" id="first_name"
    required autocomplete="on"><br>

    <label for="state">State:</label>
    <input type="text" name="state" id="state"
    required maxlength="2"
    placeholder="2-character code"
    autocomplete="on"><br>

    <label for="zip">ZIP Code:</label>
    <input type="text" name="zip" id="zip"
    required
    placeholder="5 or 9 digits"
    pattern="^\d{5}(-\d{4})?$"
    title="Either 5 or 9 digits"
    autocomplete="on"><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" name="phone" id="phone"
    placeholder="999-999-9999"
    pattern="\d{3}[\-]\d{3}[\-]\d{4}"
    title="Must be 999-999-9999 format"
    autocomplete="on"><br>
</fieldset>

<fieldset>
    <legend>Membership Information</legend>

    <label for="membership">Membership Type:</label>
    <select id="membership" name="membership">
        <option>Juniot</option>
        <option>Regular</option>
        <option>Charter</option>
    </select><br>

    <label for="date">Starting Date:</label>
    <input type="date" id="date" name="date" required><br>

    <label for="tickets">Tickets for guests:</label>
    <input type="number" id="tickets" name="tickets"
    min="1" max="4" value="2"><br>
</fieldset>

<fieldset>
    <legend>How did you Hear About Us?</legend>

    <input type="checkbox" id="search">
    <label for="search">Search engine</label><br>

    <input type="checkbox" id="Social">
    <label for="social">Social Media</label><br>

    <input type="checkbox" id="emai12">
    <label for="emai12">Email</label><br>

    <input type="checkbox" id="friend">
    <label for="friend">Friend or colleague</label>
</fieldset>

<fieldset>
    <legend>Comments</legend>

    <textarea placeholder="If you have any comments, please enter them here."></textarea>
</fieldset>

<fieldset id="buttons">
    <legend>Submit Your Membership</legend>

    <input type="submit" value="submit">
    <input type="reset" value="Reset Fields">
</fieldset>

</form>

</body>
</html>
